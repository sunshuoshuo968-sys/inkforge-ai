<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">InkForge AI narrative engine</title>
  <desc id="desc">A live novel writing workspace with an animated pen, manuscript and story memory signals.</desc>
  <style>
    .blink { animation: blink 1.1s steps(2,end) infinite; }
    .draw { stroke-dasharray: 170; stroke-dashoffset: 170; animation: draw 4.2s ease-in-out infinite; }
    .pen { transform-origin: 1145px 430px; animation: write 4.2s ease-in-out infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .reveal { animation: reveal 4.2s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes draw { 0%,14% { stroke-dashoffset: 170; } 58%,78% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    @keyframes write { 0%,14% { transform: translate(100px,-42px) rotate(-5deg); } 58%,78% { transform: translate(-112px,12px) rotate(3deg); } 100% { transform: translate(-112px,12px) rotate(3deg); } }
    @keyframes pulse { 50% { opacity: .38; } }
    @keyframes reveal { 0%,22% { opacity: .18; } 45%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .blink,.draw,.pen,.pulse,.reveal { animation: none; } }
  </style>
  <rect width="1600" height="760" rx="36" fill="#111916"/>
  <rect x="30" y="30" width="1540" height="700" rx="24" fill="none" stroke="#32443d" stroke-width="2"/>
  <path d="M68 86H116M68 86V134M1532 86H1484M1532 86V134M68 674H116M68 674V626M1532 674H1484M1532 674V626" stroke="#D19966" stroke-width="3" stroke-linecap="round"/>
  <text x="100" y="112" fill="#E7B77F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="7">MOGOU STUDIO</text>
  <text x="100" y="157" fill="#F8F3E9" font-family="Georgia,serif" font-size="42" font-weight="500">InkForge AI</text>
  <text x="101" y="193" fill="#8FA39A" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="3">LONG-FORM FICTION / WITH A MEMORY</text>
  <g transform="translate(100 252)">
    <rect width="297" height="53" rx="10" fill="#1B2923" stroke="#365248"/>
    <circle cx="27" cy="26" r="7" fill="#C65F51" class="pulse"/>
    <text x="48" y="23" fill="#F2EFE7" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">LIVE STORY ENGINE</text>
    <text x="48" y="40" fill="#91A79C" font-family="Arial,Helvetica,sans-serif" font-size="11">A creative system that stays with the story.</text>
  </g>
  <g transform="translate(100 351)">
    <text fill="#8FA39A" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="3">01</text>
    <text x="42" y="0" fill="#F8F3E9" font-family="Georgia,serif" font-size="21">Seed an idea</text>
    <line x1="0" y1="26" x2="298" y2="26" stroke="#31433C"/>
    <text y="67" fill="#8FA39A" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="3">02</text>
    <text x="42" y="67" fill="#F8F3E9" font-family="Georgia,serif" font-size="21">Build a world</text>
    <line x1="0" y1="93" x2="298" y2="93" stroke="#31433C"/>
    <text y="134" fill="#D19966" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="3">03</text>
    <text x="42" y="134" fill="#E7B77F" font-family="Georgia,serif" font-size="21">Write it forward</text>
  </g>
  <g transform="translate(480 105)">
    <rect width="990" height="542" rx="18" fill="#EEF0EA" stroke="#61736A" stroke-width="2"/>
    <rect width="990" height="58" rx="18" fill="#263630"/>
    <path d="M0 42H990" stroke="#3D5249"/>
    <circle cx="38" cy="29" r="7" fill="#C65F51"/><circle cx="62" cy="29" r="7" fill="#D6A45D"/><circle cx="86" cy="29" r="7" fill="#5E9A7D"/>
    <text x="495" y="34" fill="#D6DDD7" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">NARRATIVE WORKSPACE / LIVE</text>
    <g transform="translate(28 91)">
      <text fill="#54726A" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CHAPTERS</text>
      <rect y="24" width="183" height="50" rx="7" fill="#DCE8E1" stroke="#7B9B8E"/>
      <text x="17" y="46" fill="#1D3029" font-family="Georgia,serif" font-size="16">03  The mirror</text>
      <text x="17" y="63" fill="#668177" font-family="Arial,Helvetica,sans-serif" font-size="10">GENERATING · 1,704 WORDS</text>
      <rect y="87" width="183" height="42" rx="7" fill="#E5E7E1"/>
      <text x="17" y="112" fill="#68776F" font-family="Georgia,serif" font-size="15">04  The answer</text>
      <rect y="141" width="183" height="42" rx="7" fill="#E5E7E1"/>
      <text x="17" y="166" fill="#68776F" font-family="Georgia,serif" font-size="15">05  The storm</text>
    </g>
    <g transform="translate(252 95)">
      <text fill="#7A817B" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2">CHAPTER 03 / MANUSCRIPT</text>
      <text y="63" fill="#23332C" font-family="Georgia,serif" font-size="39">A mirror catching light</text>
      <path d="M0 88H530" stroke="#C5CBC3"/>
      <path d="M0 112H440M0 136H495M0 160H412M0 208H514M0 232H470M0 256H492M0 304H452M0 328H518" stroke="#74847B" stroke-width="5" stroke-linecap="round" class="reveal"/>
      <path d="M0 280H376" stroke="#2F6958" stroke-width="5" stroke-linecap="round" class="draw"/>
      <rect x="384" y="268" width="3" height="23" fill="#C65F51" class="blink"/>
      <text y="405" fill="#6B7A72" font-family="Arial,Helvetica,sans-serif" font-size="11">THE STORY REMEMBERS WHAT CAME BEFORE.</text>
    </g>
    <g transform="translate(812 94)">
      <rect width="145" height="217" rx="10" fill="#E2E7E0" stroke="#C3CCC3"/>
      <text x="16" y="27" fill="#426B5D" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" letter-spacing="1">AI MEMORY</text>
      <path d="M16 48H128M16 84H118M16 120H128M16 156H106" stroke="#78968A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="17" cy="190" r="5" fill="#C65F51" class="pulse"/>
      <text x="31" y="194" fill="#55736A" font-family="Arial,Helvetica,sans-serif" font-size="9">CONTEXT ACTIVE</text>
    </g>
    <g class="pen" transform="translate(0 0)">
      <path d="M795 419L851 330" stroke="#A76F4B" stroke-width="11" stroke-linecap="round"/>
      <path d="M848 332L868 295" stroke="#E5C28E" stroke-width="9" stroke-linecap="round"/>
      <path d="M867 296L872 286" stroke="#EAE5D9" stroke-width="4" stroke-linecap="round"/>
      <path d="M798 417L790 438" stroke="#16251F" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="100" y="684" fill="#6E8278" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">LOCAL-FIRST  /  YOUR STORY STAYS YOURS</text>
  <text x="1467" y="684" fill="#D19966" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="2">WRITE FURTHER ↗</text>
</svg>
